[project]
name = "django-semolina"
version = "0.1.0"
description = "Django integration for Semolina, the ORM for Semantic Views."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Anentropic", email = "ego@anentropic.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database :: Front-Ends",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Pre-1.0: minor bumps may break API. We own both sides, so the cap costs
    # only a release we'd be cutting anyway — relax to an open bound at 1.0.
    "semolina>=0.6,<0.7",
    # Floor is a support commitment (5.2 is the current LTS; 4.2 went EOL in
    # April 2026), not a technical minimum. Never cap: that would block
    # consumers from upgrading Django until we cut a release.
    "django>=5.2",
]

[project.optional-dependencies]
# Pass-through to Semolina's warehouse driver extras, so a single install line
# works: pip install django-semolina[duckdb]
snowflake = ["semolina[snowflake]"]
databricks = ["semolina[databricks]"]
duckdb = ["semolina[duckdb]"]

[project.urls]
Homepage = "https://github.com/anentropic/django-semolina"
Documentation = "https://anentropic.github.io/django-semolina/"
Repository = "https://github.com/anentropic/django-semolina"
Issues = "https://github.com/anentropic/django-semolina/issues"
Changelog = "https://anentropic.github.io/django-semolina/changelog/"

[build-system]
requires = ["uv_build>=0.12.1,<1.0.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.38.0",
    # Unpinned: local dev tracks the newest Django. CI covers the 5.2 LTS floor.
    "django",
    "django-stubs",
    "ipython>=9.10.0",
    "pdbpp>=0.12.0.post1",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-django>=4.9.0",
    "ruff>=0.15.1",
]
docs = [
    "sphinx>=8.0.0",
    "shibuya",
    "sphinx-design>=0.6.0",
    "sphinx-autoapi>=3.0.0",
    "sphinx-autobuild>=2024.0.0",
    "myst-parser>=4.0.0",
]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests"]
reportPrivateUsage = false

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH", "D"]
ignore = [
    "D1",    # don't require docstrings everywhere
    "D202",  # allow blank line after docstring (common in tests)
    "D203",  # conflicts with D211 (no blank line before class docstring)
    "D212",  # conflicts with D213 (multiline summary on second line)
    "D401",  # imperative mood is awkward for dunder methods
    "D413",  # blank line after last section not required
]

[tool.pytest.ini_options]
addopts = "-v"
# src layout: put the repo root on sys.path so `tests.settings` is importable.
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "tests.settings"
